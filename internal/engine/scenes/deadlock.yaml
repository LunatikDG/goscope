# Deadlock: circular wait. goroutine-a waits on goroutine-b, goroutine-b waits on goroutine-a —
# neither Send/Unblock ever happens, both goroutines freeze in Blocked forever.
name: "Deadlock (circular wait)"
description: "Two goroutines wait on each other in a circle — neither can ever proceed."
steps:
  - event: spawn
    goroutine: 1
    label: goroutine-a
  - event: spawn
    goroutine: 2
    label: goroutine-b

  - event: block
    goroutine: 1
    chan: 2 # waits for what only goroutine-b could send
  - event: block
    goroutine: 2
    chan: 1 # waits for what only goroutine-a could send
