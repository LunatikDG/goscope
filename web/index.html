<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>goscope</title>
</head>
<body>
    <canvas id="canvas" width="640" height="360"></canvas>
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then(res => {
            go.run(res.instance);
        });
    </script>
</body>
</html>
